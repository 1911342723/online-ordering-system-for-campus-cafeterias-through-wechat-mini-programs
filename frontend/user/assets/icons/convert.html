<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 20px; background: white; }
        .icon-box {
            display: inline-block;
            width: 81px; 
            height: 81px;
            margin: 20px;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="home" class="icon-box">
        <img src="icons8-首页.gif" alt="home">
    </div>
    <div id="cart" class="icon-box">
        <img src="icons8-购物车.gif" alt="cart">
    </div>
    <div id="order" class="icon-box">
        <img src="icons8-采购订单.gif" alt="order">
    </div>
    <div id="user" class="icon-box">
        <img src="icons8-关于我-100.svg" alt="user">
    </div>
</body>
</html>
