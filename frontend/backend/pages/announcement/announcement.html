<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家公告管理</title>
    <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/page.css" />
</head>

<body>
    <div class="dashboard-container" id="announcement-app">
        <div class="container">
            <div class="tableBar">
                <el-input v-model="input" placeholder="请输入公告标题" style="width: 250px" clearable
                    @keyup.enter.native="handleQuery">
                    <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer"
                        @click="handleQuery"></i>
                </el-input>
                <el-button type="primary" @click="addAnnouncement">+ 新建公告</el-button>
            </div>
            <el-table :data="tableData" stripe class="tableBox">
                <el-table-column prop="title" label="公告标题"></el-table-column>
                <el-table-column prop="content" label="公告内容" show-overflow-tooltip></el-table-column>
                <el-table-column label="优先级">
                    <template slot-scope="scope">
                        {{ scope.row.sort || 0 }}
                    </template>
                </el-table-column>
                <el-table-column label="生效时间">
                    <template slot-scope="scope">
                        {{ scope.row.startTime || '立即生效' }}
                    </template>
                </el-table-column>
                <el-table-column label="失效时间">
                    <template slot-scope="scope">
                        {{ scope.row.endTime || '长期有效' }}
                    </template>
                </el-table-column>
                <el-table-column label="状态">
                    <template slot-scope="scope">
                        <el-tag :type="scope.row.status === 1 ? 'success' : 'info'">
                            {{ scope.row.status === 1 ? '启用' : '停用' }}
                        </el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="创建时间">
                    <template slot-scope="scope">
                        {{ scope.row.createTime }}
                    </template>
                </el-table-column>
                <el-table-column label="操作" width="200" align="center">
                    <template slot-scope="scope">
                        <el-button type="text" size="small" class="blueBug"
                            @click="editAnnouncement(scope.row.id)">编辑</el-button>
                        <el-button type="text" size="small" class="redBug"
                            @click="deleteAnnouncement(scope.row.id)">删除</el-button>
                        <el-button type="text" size="small"
                            @click="changeStatus(scope.row)">{{ scope.row.status === 1 ? '停用' : '启用' }}</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <el-pagination class="pageList" :page-sizes="[10, 20, 30, 40]" :page-size="pageSize"
                layout="total, sizes, prev, pager, next, jumper" :total="counts" :current-page.sync="page"
                @size-change="handleSizeChange" @current-change="handleCurrentChange"></el-pagination>
        </div>
    </div>

    <!-- 新增/编辑公告对话框 -->
    <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="50%">
        <el-form :model="announcementForm" :rules="rules" ref="announcementForm" label-width="120px">
            <el-form-item label="公告标题" prop="title">
                <el-input v-model="announcementForm.title" placeholder="请输入公告标题"></el-input>
            </el-form-item>
            <el-form-item label="公告内容" prop="content">
                <el-input type="textarea" v-model="announcementForm.content" :rows="5"
                    placeholder="请输入公告内容"></el-input>
            </el-form-item>
            <el-form-item label="优先级" prop="sort">
                <el-input-number v-model="announcementForm.sort" :min="0" :max="999"
                    placeholder="数字越大优先级越高"></el-input-number>
            </el-form-item>
            <el-form-item label="生效时间">
                <el-date-picker v-model="announcementForm.startTime" type="datetime" placeholder="选择生效时间"
                    value-format="yyyy-MM-dd HH:mm:ss"></el-date-picker>
            </el-form-item>
            <el-form-item label="失效时间">
                <el-date-picker v-model="announcementForm.endTime" type="datetime" placeholder="选择失效时间"
                    value-format="yyyy-MM-dd HH:mm:ss"></el-date-picker>
            </el-form-item>
            <el-form-item label="状态">
                <el-switch v-model="announcementForm.status" :active-value="1" :inactive-value="0"
                    active-text="启用" inactive-text="停用"></el-switch>
            </el-form-item>
        </el-form>
        <span slot="footer" class="dialog-footer">
            <el-button @click="dialogVisible = false">取 消</el-button>
            <el-button type="primary" @click="submitForm">确 定</el-button>
        </span>
    </el-dialog>

    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/announcement.js"></script>
    <script src="../../js/index.js"></script>
    <script>
        new Vue({
            el: '#announcement-app',
            data() {
                return {
                    input: '',
                    counts: 0,
                    page: 1,
                    pageSize: 10,
                    tableData: [],
                    merchantId: null,
                    dialogVisible: false,
                    dialogTitle: '新增公告',
                    announcementForm: {
                        id: null,
                        title: '',
                        content: '',
                        sort: 0,
                        startTime: null,
                        endTime: null,
                        status: 1,
                        merchantId: null
                    },
                    rules: {
                        title: [
                            { required: true, message: '请输入公告标题', trigger: 'blur' },
                            { min: 2, max: 100, message: '长度在 2 到 100 个字符', trigger: 'blur' }
                        ],
                        content: [
                            { required: true, message: '请输入公告内容', trigger: 'blur' }
                        ]
                    }
                }
            },
            computed: {},
            created() {
                this.getMerchantInfo()
            },
            mounted() {
            },
            methods: {
                // 获取商家信息
                async getMerchantInfo() {
                    const employeeId = localStorage.getItem('employeeId')
                    if (!employeeId) {
                        this.$message.error('未获取到登录信息')
                        return
                    }
                    
                    const res = await getMerchantByEmployeeId(employeeId)
                    if (res.code === 1) {
                        this.merchantId = res.data.id
                        this.announcementForm.merchantId = res.data.id
                        this.init()
                    } else {
                        this.$message.error('未找到关联的商家信息')
                    }
                },
                async init() {
                    const params = {
                        page: this.page,
                        pageSize: this.pageSize,
                        merchantId: this.merchantId,
                        title: this.input || undefined
                    }
                    await getAnnouncementPage(params).then(res => {
                        if (String(res.code) === '1') {
                            this.tableData = res.data.records || []
                            this.counts = res.data.total
                        }
                    }).catch(err => {
                        this.$message.error('请求出错了：' + err)
                    })
                },
                handleQuery() {
                    this.page = 1
                    this.init()
                },
                // 添加公告
                addAnnouncement() {
                    this.dialogTitle = '新增公告'
                    this.announcementForm = {
                        id: null,
                        title: '',
                        content: '',
                        sort: 0,
                        startTime: null,
                        endTime: null,
                        status: 1,
                        merchantId: this.merchantId
                    }
                    this.dialogVisible = true
                },
                // 编辑公告
                async editAnnouncement(id) {
                    this.dialogTitle = '编辑公告'
                    const res = await getAnnouncementById(id)
                    if (res.code === 1) {
                        this.announcementForm = res.data
                        this.dialogVisible = true
                    }
                },
                // 提交表单
                submitForm() {
                    this.$refs.announcementForm.validate(async (valid) => {
                        if (valid) {
                            const res = this.announcementForm.id
                                ? await updateAnnouncement(this.announcementForm)
                                : await addAnnouncement(this.announcementForm)
                            
                            if (res.code === 1) {
                                this.$message.success(res.msg)
                                this.dialogVisible = false
                                this.init()
                            } else {
                                this.$message.error(res.msg || '操作失败')
                            }
                        }
                    })
                },
                // 删除公告
                deleteAnnouncement(id) {
                    this.$confirm('确定要删除该公告吗？', '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        const res = await deleteAnnouncement(id)
                        if (res.code === 1) {
                            this.$message.success('删除成功')
                            this.init()
                        } else {
                            this.$message.error(res.msg || '删除失败')
                        }
                    })
                },
                // 改变状态
                changeStatus(row) {
                    const status = row.status === 1 ? 0 : 1
                    const statusText = status === 1 ? '启用' : '停用'
                    
                    this.$confirm(`确定要${statusText}该公告吗？`, '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        const res = await updateAnnouncementStatus(row.id, status)
                        if (res.code === 1) {
                            this.$message.success(`${statusText}成功`)
                            this.init()
                        } else {
                            this.$message.error(res.msg || `${statusText}失败`)
                        }
                    })
                },
                handleSizeChange(val) {
                    this.pageSize = val
                    this.init()
                },
                handleCurrentChange(val) {
                    this.page = val
                    this.init()
                }
            }
        })
    </script>
</body>

</html>
