server:
  port: 8080
spring:
  application:
  #    应用名称
    name: reggie
  #    数据源配置
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/reggie?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: 123456
mybatis-plus:
  configuration:
    #在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射，例如数据库的id_number会在实体类中变为idNumber
    map-underscore-to-camel-case: true
    # 关闭全量SQL打印，避免控制台日志过长
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID

reggie:
  path: F:/开发项目/接单/CM/Online-Catering-System-main/backend/src/main/resources/food_img/

