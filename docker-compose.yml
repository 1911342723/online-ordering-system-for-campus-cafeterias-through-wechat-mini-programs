services:
  # ============================================
  # MySQL 数据库
  # ============================================
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: canteen-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: reggie
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 挂载 SQL 初始化目录
      - ./backend/sql:/docker-entrypoint-initdb.d/sql:ro
      - ./backend/sql/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=256M
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============================================
  # Redis 缓存
  # ============================================
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: canteen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ============================================
  # 后端服务 (Spring Boot)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canteen-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/reggie?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8080
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - upload-data:/app/upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - canteen-network
    restart: unless-stopped

  # ============================================
  # 管理端前端 (Admin)
  # ============================================
  admin-frontend:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: canteen-admin
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - canteen-network
    restart: unless-stopped

  # ============================================
  # 商家端前端 (Merchant)
  # ============================================
  merchant-frontend:
    build:
      context: ./frontend/merchant
      dockerfile: Dockerfile
    container_name: canteen-merchant
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - canteen-network
    restart: unless-stopped

# ============================================
# 数据卷
# ============================================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  upload-data:
    driver: local

# ============================================
# 网络
# ============================================
networks:
  canteen-network:
    driver: bridge
    name: canteen-network
